<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Neon Pocket Drum Machine</title>
  <style>
    :root { --bg:#090b11; --text:#eaf2ff; --muted:#8ea1c9; --neon:#4cf3ff; --neon2:#9d4dff; --active:#31ffd6; --step:min(10vw,52px); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{margin:0;height:100%;background:radial-gradient(circle at 30% -10%,#1a2450 0%,transparent 45%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
    .app{min-height:100%;padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto 1fr;gap:14px;max-width:520px;margin:0 auto}
    .card{background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(134,167,255,.2);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 0 30px rgba(88,141,255,.06)}
    .header,.controls{padding:14px}.header{display:flex;justify-content:space-between;align-items:center}
    h1{margin:0;font-size:clamp(1rem,4vw,1.3rem)} button{min-height:44px;border-radius:10px;border:1px solid rgba(131,186,255,.35);background:linear-gradient(180deg,#1a2237,#111826);color:var(--text);font-weight:700;padding:10px 14px}
    #playBtn.playing{border-color:var(--active);box-shadow:0 0 14px rgba(49,255,214,.45)}
    .top-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bpm-wrap{flex:1;min-width:200px}.bpm-row{display:flex;justify-content:space-between;color:var(--muted)} input[type=range]{width:100%;accent-color:var(--neon)}
    .playhead-track{height:4px;border-radius:999px;background:rgba(149,174,255,.2);overflow:hidden;margin-top:8px}.playhead{height:100%;width:12.5%;background:linear-gradient(90deg,var(--neon),var(--neon2));transition:transform .09s linear}
    .grid-wrap{padding:10px;overflow-x:auto}.grid{display:grid;grid-template-columns:78px repeat(8,var(--step));gap:8px;align-items:center;min-width:max-content}
    .label{color:var(--muted);text-align:right;padding-right:6px;font-weight:700}
    .step{width:var(--step);aspect-ratio:1;border-radius:10px;border:1px solid rgba(120,151,230,.35);background:linear-gradient(180deg,#151c2e,#0f1523);padding:0}
    .step.active{border-color:rgba(76,243,255,.9);box-shadow:0 0 14px rgba(76,243,255,.45), inset 0 0 24px rgba(76,243,255,.2);background:linear-gradient(160deg,rgba(76,243,255,.22),rgba(157,77,255,.18))}
    .step.current{outline:2px solid rgba(255,255,255,.65)}
  </style>
</head>
<body>
  <main class="app">
    <section class="card header"><h1>Neon Pocket Drum Machine</h1><span style="color:var(--muted)">8-step • 4 tracks</span></section>
    <section class="card controls">
      <div class="top-controls"><button id="playBtn">▶ Play</button><div class="bpm-wrap"><div class="bpm-row"><span>BPM</span><strong id="bpmValue">120</strong></div><input id="bpm" type="range" min="60" max="180" value="120"></div></div>
      <div class="playhead-track"><div id="playhead" class="playhead"></div></div>
    </section>
    <section class="card grid-wrap">
      <div id="grid" class="grid" aria-label="Step sequencer grid">
        <div class="label">Kick</div><button class="step" data-row="0" data-step="0"></button><button class="step" data-row="0" data-step="1"></button><button class="step" data-row="0" data-step="2"></button><button class="step" data-row="0" data-step="3"></button><button class="step" data-row="0" data-step="4"></button><button class="step" data-row="0" data-step="5"></button><button class="step" data-row="0" data-step="6"></button><button class="step" data-row="0" data-step="7"></button>
        <div class="label">Snare</div><button class="step" data-row="1" data-step="0"></button><button class="step" data-row="1" data-step="1"></button><button class="step" data-row="1" data-step="2"></button><button class="step" data-row="1" data-step="3"></button><button class="step" data-row="1" data-step="4"></button><button class="step" data-row="1" data-step="5"></button><button class="step" data-row="1" data-step="6"></button><button class="step" data-row="1" data-step="7"></button>
        <div class="label">Hi-Hat</div><button class="step" data-row="2" data-step="0"></button><button class="step" data-row="2" data-step="1"></button><button class="step" data-row="2" data-step="2"></button><button class="step" data-row="2" data-step="3"></button><button class="step" data-row="2" data-step="4"></button><button class="step" data-row="2" data-step="5"></button><button class="step" data-row="2" data-step="6"></button><button class="step" data-row="2" data-step="7"></button>
        <div class="label">Clap</div><button class="step" data-row="3" data-step="0"></button><button class="step" data-row="3" data-step="1"></button><button class="step" data-row="3" data-step="2"></button><button class="step" data-row="3" data-step="3"></button><button class="step" data-row="3" data-step="4"></button><button class="step" data-row="3" data-step="5"></button><button class="step" data-row="3" data-step="6"></button><button class="step" data-row="3" data-step="7"></button>
      </div>
    </section>
  </main>
<script>
(() => {
  const steps=8, instruments=4;
  const pattern=Array.from({length:instruments},()=>Array(steps).fill(false));
  pattern[0][0]=pattern[0][4]=true; pattern[1][2]=pattern[1][6]=true; pattern[2][1]=pattern[2][3]=pattern[2][5]=pattern[2][7]=true; pattern[3][7]=true;
  const grid=document.getElementById('grid'), playBtn=document.getElementById('playBtn'), bpm=document.getElementById('bpm'), bpmValue=document.getElementById('bpmValue'), playhead=document.getElementById('playhead');
  let ctx=null, unlocked=false, isPlaying=false, currentStep=0, nextTime=0, timer=null;
  function initAudio(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); }
  async function unlockAudio(){ initAudio(); if(unlocked) return; const b=ctx.createBuffer(1,1,22050); const s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0); if(ctx.state==='suspended') await ctx.resume(); unlocked=true; }
  function noise(d=0.2){ const sr=ctx.sampleRate,n=ctx.createBuffer(1,Math.floor(sr*d),sr),data=n.getChannelData(0); for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1; return n; }
  function kick(t){ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12); g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.17); }
  function snare(t){ const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain(),o=ctx.createOscillator(),og=ctx.createGain(); n.buffer=noise(0.2); f.type='highpass'; f.frequency.value=1200; g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.14); o.type='triangle'; o.frequency.value=200; og.gain.setValueAtTime(0.35,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.09); n.connect(f).connect(g).connect(ctx.destination); o.connect(og).connect(ctx.destination); n.start(t); o.start(t); n.stop(t+0.2); o.stop(t+0.1); }
  function hat(t){ const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain(); n.buffer=noise(0.08); f.type='highpass'; f.frequency.value=7000; g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05); n.connect(f).connect(g).connect(ctx.destination); n.start(t); n.stop(t+0.07); }
  function clap(t){ [0,0.015,0.03].forEach(off=>{ const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain(); n.buffer=noise(0.09); f.type='bandpass'; f.frequency.value=1700; g.gain.setValueAtTime(0.6,t+off); g.gain.exponentialRampToValueAtTime(0.001,t+off+0.07); n.connect(f).connect(g).connect(ctx.destination); n.start(t+off); n.stop(t+off+0.08);}); }
  function drawStep(step){ document.querySelectorAll('.step.current').forEach(el=>el.classList.remove('current')); for(let r=0;r<4;r++){ const el=grid.querySelector(`.step[data-row="${r}"][data-step="${step}"]`); if(el) el.classList.add('current'); } playhead.style.transform=`translateX(${(step*100)/steps}%)`; }
  function schedule(step,t){ if(pattern[0][step]) kick(t); if(pattern[1][step]) snare(t); if(pattern[2][step]) hat(t); if(pattern[3][step]) clap(t); setTimeout(()=>drawStep(step),Math.max(0,(t-ctx.currentTime)*1000)); }
  function advance(){ nextTime += (60/Number(bpm.value))*0.5; currentStep=(currentStep+1)%steps; }
  function clock(){ while(nextTime < ctx.currentTime+0.12){ schedule(currentStep,nextTime); advance(); } timer=setTimeout(clock,25); }
  function initGrid(){ grid.querySelectorAll('.step').forEach(btn=>{ const r=Number(btn.dataset.row),c=Number(btn.dataset.step); btn.classList.toggle('active',pattern[r][c]); btn.addEventListener('click',()=>{ pattern[r][c]=!pattern[r][c]; btn.classList.toggle('active',pattern[r][c]); });}); }
  async function toggle(){ await unlockAudio(); isPlaying=!isPlaying; playBtn.classList.toggle('playing',isPlaying); playBtn.textContent=isPlaying?'⏸ Pause':'▶ Play'; if(isPlaying){ currentStep=0; nextTime=ctx.currentTime+0.03; clock(); } else { clearTimeout(timer); document.querySelectorAll('.step.current').forEach(el=>el.classList.remove('current')); }}
  playBtn.addEventListener('click',toggle); document.addEventListener('touchstart',unlockAudio,{once:true,passive:true}); bpm.addEventListener('input',()=>bpmValue.textContent=bpm.value); initGrid();
})();
</script>
</body>
</html>
