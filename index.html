<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chibi Crime City</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #4f5bff 0%, #141414 50%, #090909 100%);
    }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(10, 10, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px 14px;
      color: #f0f0ff;
      max-width: 350px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    #ui h1 {
      margin: 0 0 8px;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #7de5ff;
    }

    #ui p {
      margin: 4px 0;
      font-size: 0.86rem;
      line-height: 1.3;
    }

    #wanted {
      color: #ffd65c;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <aside id="ui">
    <h1>Chibi Crime City</h1>
    <p>Drive with <strong>WASD / Arrows</strong>. Drift with <strong>Shift</strong>.</p>
    <p>Bump into citizens for chaos points (very cartoon chaos).</p>
    <p id="wanted">WANTED: ☆</p>
  </aside>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x7d8eff, 45, 180);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 11, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xb6d0ff, 0x3a2a56, 1.1);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 1.3);
    sun.position.set(25, 30, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -80;
    sun.shadow.camera.right = 80;
    sun.shadow.camera.top = 80;
    sun.shadow.camera.bottom = -80;
    scene.add(sun);

    const floorMat = new THREE.MeshStandardMaterial({ color: 0x4e7f48, roughness: 0.9 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x2e2e39, roughness: 0.7 });
    for (let i = -3; i <= 3; i++) {
      const road = new THREE.Mesh(new THREE.BoxGeometry(12, 0.08, 260), roadMat);
      road.position.set(i * 32, 0.04, 0);
      road.receiveShadow = true;
      scene.add(road);

      const road2 = road.clone();
      road2.geometry = new THREE.BoxGeometry(260, 0.08, 12);
      road2.position.set(0, 0.04, i * 32);
      scene.add(road2);
    }

    const buildings = new THREE.Group();
    const palette = [0xff699f, 0x7effd0, 0xffcb59, 0x95a4ff, 0xff8f70];

    for (let x = -6; x <= 6; x++) {
      for (let z = -6; z <= 6; z++) {
        if (Math.abs(x) <= 1 || Math.abs(z) <= 1) continue;
        if (Math.random() < 0.28) continue;

        const w = 6 + Math.random() * 6;
        const d = 6 + Math.random() * 6;
        const h = 6 + Math.random() * 30;
        const b = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({ color: palette[(x * z + 17) % palette.length], roughness: 0.45, metalness: 0.08 })
        );
        b.position.set(x * 18 + (Math.random() - 0.5) * 5, h / 2, z * 18 + (Math.random() - 0.5) * 5);
        b.castShadow = true;
        b.receiveShadow = true;

        const crown = new THREE.Mesh(
          new THREE.ConeGeometry(Math.max(w, d) * 0.45, 2 + Math.random() * 4, 6),
          new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x222244 })
        );
        crown.position.y = h / 2 + 2;
        b.add(crown);
        buildings.add(b);
      }
    }
    scene.add(buildings);

    const car = new THREE.Group();
    const chassis = new THREE.Mesh(
      new THREE.BoxGeometry(2.8, 1.1, 4.6),
      new THREE.MeshStandardMaterial({ color: 0xff315f, roughness: 0.35, metalness: 0.3 })
    );
    chassis.castShadow = true;
    car.add(chassis);

    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.8, 2.3),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
    );
    roof.position.y = 0.75;
    roof.castShadow = true;
    car.add(roof);

    const wheelGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.5, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x191919, roughness: 0.8 });
    for (const [x, z] of [[1.3, 1.7], [-1.3, 1.7], [1.3, -1.7], [-1.3, -1.7]]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(x, -0.45, z);
      w.castShadow = true;
      car.add(w);
    }

    car.position.y = 1;
    scene.add(car);

    const pedestrians = [];
    const pedGroup = new THREE.Group();
    scene.add(pedGroup);

    function makePedestrian() {
      const p = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 0.8, 4, 8), new THREE.MeshStandardMaterial({ color: 0x56b2ff }));
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.65, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffd9b0 }));
      head.position.y = 1;
      p.add(body, head);
      p.position.set((Math.random() - 0.5) * 170, 1, (Math.random() - 0.5) * 170);
      p.userData = { dir: Math.random() * Math.PI * 2, speed: 2 + Math.random() * 2 };
      p.traverse((obj) => (obj.castShadow = true));
      pedGroup.add(p);
      pedestrians.push(p);
    }

    for (let i = 0; i < 45; i++) makePedestrian();

    const keys = {};
    addEventListener("keydown", (e) => (keys[e.key.toLowerCase()] = true));
    addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = false));

    let speed = 0;
    let heading = 0;
    let wanted = 1;
    const wantedEl = document.getElementById("wanted");

    const clock = new THREE.Clock();

    function updatePlayer(dt) {
      const accel = keys["w"] || keys["arrowup"] ? 16 : keys["s"] || keys["arrowdown"] ? -14 : 0;
      const turn = keys["a"] || keys["arrowleft"] ? 1 : keys["d"] || keys["arrowright"] ? -1 : 0;
      const drift = keys["shift"] ? 1.5 : 1;

      speed += accel * dt;
      speed *= 0.96;
      speed = THREE.MathUtils.clamp(speed, -14, 24);

      heading += turn * dt * (1.7 + Math.abs(speed) * 0.04) * drift * (speed >= 0 ? 1 : -1);

      car.position.x += Math.sin(heading) * speed * dt;
      car.position.z += Math.cos(heading) * speed * dt;
      car.rotation.y = heading;

      car.position.x = THREE.MathUtils.clamp(car.position.x, -120, 120);
      car.position.z = THREE.MathUtils.clamp(car.position.z, -120, 120);
    }

    function updatePedestrians(dt) {
      pedestrians.forEach((p) => {
        if (Math.random() < 0.01) p.userData.dir += (Math.random() - 0.5) * 1.4;
        p.position.x += Math.sin(p.userData.dir) * p.userData.speed * dt;
        p.position.z += Math.cos(p.userData.dir) * p.userData.speed * dt;

        if (Math.abs(p.position.x) > 118 || Math.abs(p.position.z) > 118) p.userData.dir += Math.PI;

        const dist = p.position.distanceTo(car.position);
        if (dist < 2.6) {
          const away = p.position.clone().sub(car.position).setY(0).normalize();
          p.position.addScaledVector(away, (2.6 - dist) * 0.8);
          p.userData.dir = Math.atan2(away.x, away.z);
          wanted = Math.min(5, wanted + 0.008);
        }
      });
    }

    function updateCamera(dt) {
      const behind = new THREE.Vector3(Math.sin(heading) * -16, 11, Math.cos(heading) * -16);
      const targetPos = car.position.clone().add(behind);
      camera.position.lerp(targetPos, 1 - Math.exp(-dt * 5));
      const lookAt = car.position.clone().add(new THREE.Vector3(0, 3, 0));
      camera.lookAt(lookAt);
    }

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.033);
      updatePlayer(dt);
      updatePedestrians(dt);
      updateCamera(dt);

      wanted = Math.max(1, wanted - dt * 0.06);
      const stars = "★".repeat(Math.floor(wanted));
      wantedEl.textContent = `WANTED: ${stars}`;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
